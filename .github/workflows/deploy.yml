# Deploy Poesia Timeline su Coolify
name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy to coolify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy via API
        run: |
          curl -s -X POST "https://console.pyragogy.org/api/v1/deploy?uuid=h6xwikkedexlxzjd32psxpnp" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}'